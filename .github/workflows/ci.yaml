name: CI
on:
  push:
    branches: [main, main-rules-foreign-cc]
  pull_request:
    branches: [main, main-rules-foreign-cc]
  workflow_dispatch:

concurrency:
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ (github.ref_name == 'main' || github.ref_name == 'main-rules-foreign-cc') && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'main-rules-foreign-cc' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["9.x"]
        folder:
          - .
          - e2e/smoke
          - e2e/pakket
          - e2e/deps_txt
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      BB_ENDPOINT: ${{ vars.BB_ENDPOINT || secrets.BB_ENDPOINT }}
      BB_TOKEN: ${{ secrets.BB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            ${{ matrix.folder == '.' && 'common --config=ci ' || '' }}
      - name: Configure BuildBuddy RBE credentials
        if: ${{ env.BB_TOKEN != '' }}
        run: |
          ENDPOINT="${BB_ENDPOINT:-grpcs://remote.buildbuddy.io}"
          if [[ ! "${ENDPOINT}" =~ ^grpcs?:// ]]; then
            ENDPOINT="grpcs://${ENDPOINT}"
          fi
          HOST="${ENDPOINT#*://}"
          RESULTS_URL="https://${HOST}/invocation/"
          cat >> ~/.bazelrc <<EOF
          common:rbe --remote_executor=${ENDPOINT}
          common:rbe --remote_cache=${ENDPOINT}
          common:rbe --bes_backend=${ENDPOINT}
          common:rbe --bes_results_url=${RESULTS_URL}
          common:rbe --remote_header=x-buildbuddy-api-key=${BB_TOKEN}
          common:rbe --bes_header=x-buildbuddy-api-key=${BB_TOKEN}
          common:rbe --build_metadata=ROLE=CI
          EOF
          cat >> .bazelrc.user <<EOF
          common:rbe --remote_executor=${ENDPOINT}
          common:rbe --remote_cache=${ENDPOINT}
          common:rbe --bes_backend=${ENDPOINT}
          common:rbe --bes_results_url=${RESULTS_URL}
          common:rbe --remote_header=x-buildbuddy-api-key=${BB_TOKEN}
          common:rbe --bes_header=x-buildbuddy-api-key=${BB_TOKEN}
          common:rbe --build_metadata=ROLE=CI
          EOF
      - name: Run Bazel tests
        run: |
          if [ -n "${BB_TOKEN}" ]; then
            bazel test --config=rbe //...
          else
            bazel test //...
          fi

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1

  conclusion:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@v3.0.3
      - name: report success
        if: ${{ env.WORKFLOW_CONCLUSION == 'success' }}
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 0
      - name: report failure
        if: ${{ env.WORKFLOW_CONCLUSION == 'failure' }}
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 1
