manual_tests:
  - '*'
defines_select:
  "@platforms//os:osx":
    - HAVE_DEV_PTMX
    - HAVE_GRANTPT
    - HAVE_OPENPTY
    - HAVE_POSIX_OPENPT
    - HAVE_PTSNAME
    - HAVE_PTSNAME_R
    - HAVE_SIGACTION
    - HAVE_TERMIOS_H
    - HAVE_TTYNAME
    - HAVE_UNLOCKPT
    - HAVE_UTIL_H
    - OSX_COMPAT
  "//conditions:default":
    - HAVE_DEV_PTMX
    - HAVE_GETPT
    - HAVE_GRANTPT
    - HAVE_OPENPTY
    - HAVE_POSIX_OPENPT
    - HAVE_PTSNAME
    - HAVE_PTSNAME_R
    - HAVE_PTY_H
    - HAVE_SIGACTION
    - HAVE_TERMIOS_H
    - HAVE_TTYNAME
    - HAVE_UNLOCKPT
linkopts_select:
  "@platforms//os:linux":
    - -lutil
  "//conditions:default": []
output_loc: auto/IO/Tty/Tty
patch_cmds:
  - "mkdir -p lib/IO/Tty && cp Tty.pm lib/IO/Tty.pm && cp Pty.pm lib/IO/Pty.pm && printf 'package IO::Tty::Constant;\\nour $VERSION = \"1.31\";\\nrequire Exporter;\\nour @ISA = qw(Exporter);\\nour @EXPORT_OK = qw();\\n1;\\n' > lib/IO/Tty/Constant.pm"
