defines:
- GRPC_VERSION_1_1
- GRPC_VERSION_1_2
- GRPC_VERSION_1_4
- GRPC_VERSION_1_7
- GRPC_RECV_STATUS_ON_CLIENT_HAS_ERROR_STRING
- GRPC_SSL_CREDENTIALS_HAS_4_ARGS
- GRPC_METADATA_CREDENTIALS_CRATE_FROM_PLUGIN_HAS_3_ARGS
- GRPC_NO_INSECURE_BUILD
- GRPC_HAS_SHUTDOWN_BLOCKING
manual_tests:
- t/15-xs_end_to_end.t
- t/16-xs_secure_end_to_end.t
native_deps:
- '@grpc//:grpc'
output_loc: auto/Grpc/XS/XS
patch_cmds:
- sed -i 's|#include <grpc/grpc_security.h>|#include <grpc/grpc_security.h>\n#include <grpc/credentials.h>|g' util.h ext/*.h
- sed -i '/#include <grpc\/slice\.h>/a typedef grpc_slice gpr_slice;\n#define gpr_slice_from_copied_buffer grpc_slice_from_copied_buffer\n#define gpr_slice_unref grpc_slice_unref\n#define GPR_SLICE_START_PTR GRPC_SLICE_START_PTR\n#define GPR_SLICE_LENGTH GRPC_SLICE_LENGTH\n#define gpr_log grpc_absl_log' util.h
- sed -i '/grpc_google_default_credentials_create/,/);/c\    ctx->wrapped = grpc_google_default_credentials_create(NULL, NULL);' ext/channel_credentials.xs
